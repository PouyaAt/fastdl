name: Test FastDL

on:
  workflow_dispatch:

permissions:
  contents: write       # <‑‑ allow commits to the repo

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run test script
        run: |
          echo "RUNNING TEST SCRIPT" > script_started.txt
          python fastdl_test.py || echo "Script failed" > error_log.txt
          echo "SCRIPT FINISHED" > script_finished.txt

      - name: Create debug files
        run: |
          echo "=== BRANCH INFO ===" > current_branch.txt
          git branch >> current_branch.txt
          echo "=== WORKSPACE FILES ===" > workspace_files.txt
          ls -lah >> workspace_files.txt
          echo "=== GIT STATUS ===" > git_status.txt
          git status >> git_status.txt

      - name: Commit output to the same branch
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Current branch according to runner:"
          echo "${{ github.ref_name }}"

          git checkout ${{ github.ref_name }}

          git add fastdl_output.html error_log.txt script_started.txt script_finished.txt current_branch.txt workspace_files.txt git_status.txt || true
          git commit -m "Add FastDL result and debug info (auto)" || echo "Nothing new to commit"
          git push origin ${{ github.ref_name }} || echo "Push failed"
