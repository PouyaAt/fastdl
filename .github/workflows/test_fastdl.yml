name: Test FastDL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install requests

      - name: Run test and save output
        run: python fastdl_test.py

      # Save branch name so we can see where the commit goes
      - name: Show branch name
        run: |
          git branch > current_branch.txt

      # Save list of files in the workspace
      - name: Save workspace file list
        run: |
          echo "=== FILE LIST AFTER PYTHON SCRIPT ===" > workspace_files.txt
          ls -lah >> workspace_files.txt

      # Save git status
      - name: Save git status
        run: |
          echo "=== GIT STATUS ===" > git_status.txt
          git status >> git_status.txt

      # Commit files back to the branch this workflow was triggered from
      - name: Commit output to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Ensure we push to the correct branch
          git checkout ${{ github.ref_name }}

          git add fastdl_output.html error_log.txt script_started.txt script_finished.txt current_branch.txt workspace_files.txt git_status.txt || true
          git commit -m "Add FastDL result and debug info" || echo "Nothing to commit"
          git push || true
