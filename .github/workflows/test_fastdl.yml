name: Test FastDL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install requests

      - name: Run test and save output
        run: python fastdl_test.py

      - name: List files after script
        run: |
          echo "=== WORKSPACE FILES AFTER PYTHON SCRIPT ==="
          ls -lah

      - name: Commit output to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          echo "=== GIT STATUS ==="
          git status

          git add fastdl_output.html error_log.txt || true
          git commit -m "Add FastDL result" || echo "Nothing to commit"
          git push
