name: Instagram Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Instagram post URL"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run downloader (debug mode)
        env:
          IG_URL: ${{ github.event.inputs.url }}
        run: |
          echo "================ DEBUG START ================"
          echo "Python version:"
          python -V || true

          echo "IG_URL environment variable:"
          echo "$IG_URL"

          echo "Current directory:"
          pwd

          echo "Files in workspace:"
          ls -lah

          echo "Running download.py..."
          set -x
          python download.py 2>&1 | tee python_error_output.txt
          echo "Exit code: $?"

          echo "================ DEBUG END ================"

      - name: Commit downloaded files and logs
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add downloaded.* fastdl_api_response.json error_log.txt python_error_output.txt || true
          git commit -m "Workflow output files" || echo "Nothing to commit"
          git push
