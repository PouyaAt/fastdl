name: Instagram Downloader

on:
  workflow_dispatch:
    inputs:
      instagram_url:
        description: "Instagram post URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install requests beautifulsoup4

      - name: Export IG URL
        run: echo "IG_URL=${{ github.event.inputs.instagram_url }}" >> $GITHUB_ENV

      - name: Run downloader
        run: |
          echo "script started" > script_started.txt
          python download.py || echo "python script failed" > error_log.txt
          echo "script finished" > script_finished.txt

      - name: Workspace file list
        run: |
          echo "=== WORKSPACE FILES ===" > workspace_files.txt
          ls -lh >> workspace_files.txt

      - name: Git status
        run: git status > git_status.txt

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout ${{ github.ref_name }}

          git add -A
          git commit -m "Downloaded Instagram media via FastDL" || echo "Nothing to commit"
          git push origin ${{ github.ref_name }}
