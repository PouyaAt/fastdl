name: Test FastDL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-fastdl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Record branch
        run: |
          echo "${GITHUB_REF_NAME}" > current_branch.txt

      - name: Run FastDL test script
        run: |
          echo "script started" > script_started.txt
          python fastdl_test.py || echo "python script failed" > error_log.txt
          echo "script finished" > script_finished.txt

      - name: List workspace files
        run: |
          echo "=== WORKSPACE FILES ===" > workspace_files.txt
          ls -lh >> workspace_files.txt

      - name: Save git status
        run: |
          git status > git_status.txt

      - name: Commit output to the same branch
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout ${{ github.ref_name }}

          git add -A
          git commit -m "Add FastDL result and debug info (auto)" || echo "Nothing to commit"
          git push origin ${{ github.ref_name }}
