name: Instagram Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Instagram post URL"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run downloader
        env:
          IG_URL: ${{ github.event.inputs.url }}
        run: |
          python download.py

      - name: Commit downloaded files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add downloaded.* fastdl_api_response.json error_log.txt || true

          git commit -m "Downloaded Instagram media" || echo "Nothing to commit"

          git push
