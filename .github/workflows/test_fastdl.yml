name: Test FastDL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install requests

      - name: Run test and save output
        run: python fastdl_test.py

      - name: Save workspace file list
        run: |
          echo "=== FILE LIST AFTER PYTHON SCRIPT ===" > workspace_files.txt
          ls -lah >> workspace_files.txt

      - name: Save git status
        run: |
          echo "=== GIT STATUS ===" > git_status.txt
          git status >> git_status.txt

      - name: Commit debug files to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add fastdl_output.html error_log.txt workspace_files.txt git_status.txt || true
          git commit -m "Add debug info" || echo "Nothing to commit"
          git push || true
